<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Transport Login — Abbottabad Prime</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import{getAuth,signInWithEmailAndPassword,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
const app=initializeApp({apiKey:"AIzaSyD37yFDGpB8bLQDLzPcyih65os63p6_6v0",authDomain:"abbottabad-prime.firebaseapp.com",projectId:"abbottabad-prime",storageBucket:"abbottabad-prime.firebasestorage.app",messagingSenderId:"673825253973",appId:"1:673825253973:web:2972cd69f9a2183ca702dc"});
const auth=getAuth(app);
window.fbAuth=auth;window.fbSignIn=signInWithEmailAndPassword;
onAuthStateChanged(auth,function(user){if(user)window.location.href='/transport/dashboard.html';});
</script>
<style>
:root{--bg:#0b0f19;--surface:#121826;--line:rgba(0,242,254,0.15);--cyan:#00f2fe;--green:#1aff8c;--txt:#eaf2ff;--dim:#9fb0cc;--grad:linear-gradient(110deg,#00f2fe,#2b6fff 45%,#1aff8c);--glow:0 0 20px rgba(0,242,254,0.2);--glow2:0 0 35px rgba(0,242,254,0.4);}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Manrope',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:36px 28px;box-shadow:var(--glow2);text-align:center}
.brand{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:24px}
.mark{width:38px;height:38px;border-radius:11px;background:var(--grad);display:grid;place-items:center;color:#04121f;font-weight:900;font-size:1.1rem}
.title{font-family:'Orbitron',sans-serif;font-size:1.2rem;font-weight:700;margin-bottom:6px}
.sub{color:var(--dim);font-size:.86rem;margin-bottom:24px}
.field{margin-bottom:14px;text-align:left}
.field label{display:block;font-size:.8rem;font-weight:700;color:var(--dim);margin-bottom:6px}
.field input{width:100%;background:rgba(11,15,25,.8);border:1px solid var(--line);border-radius:11px;color:var(--txt);font-family:inherit;font-size:.94rem;padding:12px 14px;outline:0;transition:border-color .25s}
.field input:focus{border-color:var(--cyan)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;cursor:pointer;border:0;font-family:'Manrope',sans-serif;font-weight:700;font-size:.95rem;padding:13px;border-radius:12px;transition:all .25s;margin-top:8px;text-decoration:none}
.btn.grad{color:#04121f;background:var(--grad);box-shadow:var(--glow)}
.btn.ghost{background:transparent;color:var(--dim);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--cyan);color:var(--cyan)}
#toaster{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;width:min(92vw,380px)}
.toast{padding:12px 16px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:.88rem;font-weight:600}
.toast.ok{border-color:rgba(26,255,140,.5)}.toast.err{border-color:rgba(255,93,108,.5)}
</style>
</head>
<body>
<div id="toaster"></div>
<div class="card">
<div class="brand"><span class="mark">🚗</span><span style="font-family:'Orbitron',sans-serif;font-size:.95rem;font-weight:800">Transport <span style="background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent">Login</span></span></div>
<div class="title">Driver Dashboard</div>
<div class="sub">Login to manage your rides & deliveries</div>
<div class="field"><label>Email</label><input id="email" type="email" placeholder="yourname@gmail.com" onkeydown="if(event.key==='Enter')doLogin()"/></div>
<div class="field"><label>Password</label><input id="pass" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()"/></div>
<button class="btn grad" id="loginBtn" onclick="doLogin()">🔓 Login</button>
<a href="/transport/register.html" class="btn ghost">🚀 Register as Driver</a>
<a href="/" class="btn ghost" style="margin-top:4px">🏠 Main Site</a>
</div>
<script>
function toast(msg,type){const el=document.createElement('div');el.className='toast '+(type||'');el.textContent=msg;document.getElementById('toaster').appendChild(el);setTimeout(function(){el.remove();},4000);}
async function doLogin(){
  const email=document.getElementById('email').value.trim();
  const pass=document.getElementById('pass').value;
  if(!email||!pass){toast('Please enter email and password.','err');return;}
  const btn=document.getElementById('loginBtn');
  btn.disabled=true;btn.textContent='Logging in…';
  try{await window.fbSignIn(window.fbAuth,email,pass);}
  catch(e){toast('Incorrect email or password.','err');btn.disabled=false;btn.textContent='🔓 Login';}
}
</script>
</body>
</html>
