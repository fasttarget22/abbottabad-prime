<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Pharmacy Portal — Pakistan Prime</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#0b0f19;--surface:#121826;--line:rgba(0,242,254,0.15);--cyan:#00f2fe;--green:#1aff8c;--txt:#eaf2ff;--dim:#9fb0cc;--faint:#6b7a99;--grad:linear-gradient(110deg,#00f2fe,#2b6fff 45%,#1aff8c);--red:#ff5d6c;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Manrope,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}
.topbar{background:var(--surface);border-bottom:1px solid var(--line);padding:14px 20px;display:flex;align-items:center;gap:12px}
.topbar h1{font-family:Orbitron,sans-serif;font-size:.95rem;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.shell{max-width:900px;margin:0 auto;padding:20px 16px}
.search-bar{display:flex;gap:10px;margin-bottom:20px}
.search-bar input{flex:1;background:rgba(11,15,25,.8);border:1px solid var(--line);border-radius:12px;color:var(--txt);font-family:inherit;font-size:.92rem;padding:12px 16px;outline:0;transition:border-color .25s}
.search-bar input:focus{border-color:var(--cyan)}
.btn{display:inline-flex;align-items:center;gap:6px;cursor:pointer;border:0;font-family:Manrope,sans-serif;font-weight:700;font-size:.82rem;padding:10px 18px;border-radius:9px;transition:all .25s}
.btn.grad{color:#04121f;background:var(--grad)}
.btn.ghost{background:transparent;color:var(--txt);border:1px solid var(--line)}
.btn.wa{background:linear-gradient(135deg,#25d366,#0fae53);color:#03190d}
.btn.full{width:100%;justify-content:center;margin-top:8px}
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.filter-btn{background:rgba(0,242,254,.05);border:1px solid var(--line);border-radius:20px;color:var(--dim);font-family:Manrope,sans-serif;font-weight:700;font-size:.78rem;padding:7px 14px;cursor:pointer;transition:all .25s}
.filter-btn.active{background:rgba(0,242,254,.15);border-color:var(--cyan);color:var(--cyan)}
.pharmacy-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.pharmacy-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;transition:all .3s}
.pharmacy-card:hover{border-color:var(--cyan);transform:translateY(-4px)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:100;display:none;align-items:center;justify-content:center;padding:16px}
.modal-overlay.open{display:flex}
.modal-card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;position:relative}
.modal-close{position:absolute;top:12px;right:12px;background:none;border:0;color:var(--faint);font-size:1.2rem;cursor:pointer}
.field{margin-bottom:14px}
.field label{display:block;font-size:.8rem;font-weight:700;color:var(--dim);margin-bottom:6px}
.field input,.field textarea,.field select{width:100%;background:rgba(11,15,25,.8);border:1px solid var(--line);border-radius:10px;color:var(--txt);font-family:inherit;font-size:.92rem;padding:11px 13px;outline:0}
.field textarea{min-height:80px}
.spinner{width:28px;height:28px;border:3px solid rgba(0,242,254,.2);border-top-color:var(--cyan);border-radius:50%;margin:40px auto;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:60px 20px;color:var(--faint)}
#toaster{position:fixed;top:16px;right:16px;z-index:200;display:flex;flex-direction:column;gap:8px;width:min(90vw,320px)}
.toast{padding:11px 14px;border-radius:11px;background:var(--surface);border:1px solid var(--line);font-size:.84rem;font-weight:600}
.toast.ok{border-color:rgba(26,255,140,.5)}
.toast.err{border-color:rgba(255,93,108,.5)}
</style>
</head>
<body>
<div id="toaster"></div>
<div class="topbar">
<a href="/" style="color:var(--cyan);text-decoration:none;font-size:1.2rem">←</a>
<h1>💊 Pharmacy Portal</h1>
</div>
<div class="shell">
<div style="text-align:center;margin-bottom:24px">
<div style="font-size:2.5rem;margin-bottom:8px">💊</div>
<h2 style="font-family:Orbitron,sans-serif;font-size:1.1rem;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent">Find Medicines Near You</h2>
<p style="color:var(--dim);font-size:.84rem;margin-top:6px">Search medicines or find pharmacies in Abbottabad</p>
</div>
<div class="search-bar">
<input id="medSearch" type="text" placeholder="Search medicine name e.g. Panadol, Augmentin..."/>
<button class="btn grad" onclick="searchMedicine()">Search</button>
</div>
<div class="filter-bar">
<button class="filter-btn active" onclick="filterPharmacy('all',this)">All Pharmacies</button>
<button class="filter-btn" onclick="filterPharmacy('Pharmacy / Medical Store',this)">Medical Store</button>
<button class="filter-btn" onclick="filterPharmacy('Herbal',this)">Herbal</button>
</div>
<div class="pharmacy-grid" id="pharmacyGrid"><div class="spinner"></div></div>
</div>
<div class="modal-overlay" id="orderModal">
<div class="modal-card">
<button class="modal-close" onclick="closeModal()">✕</button>
<div id="modalPharmacyInfo" style="margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--line)"></div>
<h3 style="font-family:Orbitron,sans-serif;font-size:.85rem;color:var(--cyan);margin-bottom:14px">Order Medicine</h3>
<div class="field"><label>Your Name</label><input id="oName" type="text" placeholder="Your full name"/></div>
<div class="field"><label>Your Phone</label><input id="oPhone" type="tel" placeholder="03XX-XXXXXXX"/></div>
<div class="field"><label>Medicine Name(s)</label><textarea id="oMeds" placeholder="e.g. Panadol 500mg x2, Augmentin 625mg x1"></textarea></div>
<div class="field"><label>Delivery Address</label><input id="oAddress" type="text" placeholder="Your address"/></div>
<div class="field"><label>Have Prescription?</label>
<select id="oRx">
<option value="no">No prescription</option>
<option value="yes">Yes I have prescription</option>
<option value="doctor">Doctor prescribed online</option>
</select></div>
<button class="btn wa full" onclick="sendOrder()">💬 Send Order via WhatsApp</button>
</div>
</div>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import{getFirestore,collection,getDocs}from'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
const app=initializeApp({apiKey:'AIzaSyD37yFDGpB8bLQDLzPcyih65os63p6_6v0',authDomain:'abbottabad-prime.firebaseapp.com',projectId:'abbottabad-prime'});
const db=getFirestore(app);
let allPharmacies=[];
let currentPharmacy=null;
function toast(msg,type){const t=document.createElement('div');t.className='toast '+(type||'');t.textContent=msg;document.getElementById('toaster').appendChild(t);setTimeout(()=>t.remove(),3000);}
async function loadPharmacies(){
const grid=document.getElementById('pharmacyGrid');
try{
const snap=await getDocs(collection(db,'vendors'));
allPharmacies=snap.docs.map(d=>({id:d.id,...d.data()})).filter(v=>v.adminApproved&&!v.blacklisted&&v.category&&(v.category.includes('Pharmacy')||v.category.includes('Medical Store')||v.category.includes('Herbal')||v.category.includes('Homeopathic')));
renderPharmacies(allPharmacies);
}catch(e){grid.innerHTML='<div class="empty">Could not load pharmacies.</div>';}
}
function renderPharmacies(list){
const grid=document.getElementById('pharmacyGrid');
if(!list.length){grid.innerHTML='<div class="empty">No pharmacies found.</div>';return;}
grid.innerHTML=list.map(v=>'<div class="pharmacy-card">'+(v.photo?'<img src="'+v.photo+'" style="width:100%;height:120px;object-fit:cover;border-radius:10px;margin-bottom:12px"/>':'<div style="font-size:2.5rem;margin-bottom:12px">💊</div>')+'<div style="font-weight:800;font-size:.95rem;margin-bottom:4px">'+v.name+'</div><div style="color:var(--cyan);font-size:.78rem;margin-bottom:6px">'+v.category+'</div><div style="color:var(--faint);font-size:.75rem;margin-bottom:12px">📍 '+(v.city||v.address||'Abbottabad')+'</div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn grad" style="font-size:.76rem;padding:7px 12px" onclick="openOrder(\''+v.id+'\')">🛒 Order</button><a href="https://wa.me/92'+(v.phone||'').replace(/^0/,'').replace(/[^0-9]/g,'')+'" target="_blank" class="btn wa" style="font-size:.76rem;padding:7px 12px">💬 WhatsApp</a></div></div>').join('');
}
window.filterPharmacy=function(cat,btn){
document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
btn.classList.add('active');
renderPharmacies(cat==='all'?allPharmacies:allPharmacies.filter(v=>v.category&&v.category.includes(cat)));
};
window.searchMedicine=function(){
const q=document.getElementById('medSearch').value.trim().toLowerCase();
if(!q){renderPharmacies(allPharmacies);return;}
toast('Showing all pharmacies — call to check medicine availability','ok');
renderPharmacies(allPharmacies);
};
window.openOrder=function(id){
currentPharmacy=allPharmacies.find(v=>v.id===id);
if(!currentPharmacy)return;
document.getElementById('modalPharmacyInfo').innerHTML='<div style="font-weight:800;font-size:1rem">'+currentPharmacy.name+'</div><div style="color:var(--cyan);font-size:.82rem;margin-top:2px">'+currentPharmacy.category+'</div><div style="color:var(--faint);font-size:.75rem;margin-top:4px">📍 '+(currentPharmacy.city||currentPharmacy.address||'Abbottabad')+'</div>';
document.getElementById('orderModal').classList.add('open');
};
window.closeModal=function(){document.getElementById('orderModal').classList.remove('open');};
window.sendOrder=function(){
const name=document.getElementById('oName').value.trim();
const phone=document.getElementById('oPhone').value.trim();
const meds=document.getElementById('oMeds').value.trim();
const address=document.getElementById('oAddress').value.trim();
const rx=document.getElementById('oRx').value;
if(!name||!phone||!meds){toast('Please fill Name, Phone and Medicines','err');return;}
const msg='💊 *Medicine Order*\n\n👤 Name: '+name+'\n📞 Phone: '+phone+'\n💊 Medicines: '+meds+'\n📍 Address: '+(address||'Will collect')+'\n📋 Prescription: '+rx+'\n\nOrdered via Pakistan Prime Portal';
const pPhone='92'+(currentPharmacy.phone||'').replace(/^0/,'').replace(/[^0-9]/g,'');
window.open('https://wa.me/'+pPhone+'?text='+encodeURIComponent(msg),'_blank');
toast('Order sent!','ok');
closeModal();
};
loadPharmacies();
</script>
</body>
</html>
