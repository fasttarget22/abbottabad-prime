<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Diagnostics Center — Pakistan Prime</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#0b0f19;--surface:#121826;--line:rgba(0,242,254,0.15);--cyan:#00f2fe;--green:#1aff8c;--txt:#eaf2ff;--dim:#9fb0cc;--faint:#6b7a99;--grad:linear-gradient(110deg,#00f2fe,#2b6fff 45%,#1aff8c);--red:#ff5d6c;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Manrope,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}
.topbar{background:var(--surface);border-bottom:1px solid var(--line);padding:14px 20px;display:flex;align-items:center;gap:12px}
.topbar h1{font-family:Orbitron,sans-serif;font-size:.95rem;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.shell{max-width:900px;margin:0 auto;padding:20px 16px}
.search-bar{display:flex;gap:10px;margin-bottom:20px}
.search-bar input{flex:1;background:rgba(11,15,25,.8);border:1px solid var(--line);border-radius:12px;color:var(--txt);font-family:inherit;font-size:.92rem;padding:12px 16px;outline:0;transition:border-color .25s}
.search-bar input:focus{border-color:var(--cyan)}
.btn{display:inline-flex;align-items:center;gap:6px;cursor:pointer;border:0;font-family:Manrope,sans-serif;font-weight:700;font-size:.82rem;padding:10px 18px;border-radius:9px;transition:all .25s}
.btn.grad{color:#04121f;background:var(--grad)}
.btn.ghost{background:transparent;color:var(--txt);border:1px solid var(--line)}
.btn.wa{background:linear-gradient(135deg,#25d366,#0fae53);color:#03190d}
.btn.full{width:100%;justify-content:center;margin-top:8px}
.test-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:24px}
.test-card{background:rgba(0,242,254,.05);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center;cursor:pointer;transition:all .25s}
.test-card:hover,.test-card.selected{border-color:var(--cyan);background:rgba(0,242,254,.1)}
.test-card .ti{font-size:1.8rem;margin-bottom:6px}
.test-card .tn{font-size:.76rem;font-weight:700;color:var(--dim)}
.center-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.center-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;transition:all .3s}
.center-card:hover{border-color:var(--cyan);transform:translateY(-4px)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:100;display:none;align-items:center;justify-content:center;padding:16px}
.modal-overlay.open{display:flex}
.modal-card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;position:relative}
.modal-close{position:absolute;top:12px;right:12px;background:none;border:0;color:var(--faint);font-size:1.2rem;cursor:pointer}
.field{margin-bottom:14px}
.field label{display:block;font-size:.8rem;font-weight:700;color:var(--dim);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;background:rgba(11,15,25,.8);border:1px solid var(--line);border-radius:10px;color:var(--txt);font-family:inherit;font-size:.92rem;padding:11px 13px;outline:0}
.spinner{width:28px;height:28px;border:3px solid rgba(0,242,254,.2);border-top-color:var(--cyan);border-radius:50%;margin:40px auto;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:60px 20px;color:var(--faint)}
#toaster{position:fixed;top:16px;right:16px;z-index:200;display:flex;flex-direction:column;gap:8px;width:min(90vw,320px)}
.toast{padding:11px 14px;border-radius:11px;background:var(--surface);border:1px solid var(--line);font-size:.84rem;font-weight:600}
.toast.ok{border-color:rgba(26,255,140,.5)}
.toast.err{border-color:rgba(255,93,108,.5)}
</style>
</head>
<body>
<div id="toaster"></div>
<div class="topbar">
<a href="/" style="color:var(--cyan);text-decoration:none;font-size:1.2rem">←</a>
<h1>🔬 Diagnostics Center</h1>
</div>
<div class="shell">
<div style="text-align:center;margin-bottom:24px">
<div style="font-size:2.5rem;margin-bottom:8px">🔬</div>
<h2 style="font-family:Orbitron,sans-serif;font-size:1.1rem;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent">Book a Diagnostic Test</h2>
<p style="color:var(--dim);font-size:.84rem;margin-top:6px">MRI, X-Ray, Ultrasound, Blood Tests & more</p>
</div>
<div class="search-bar">
<input id="testSearch" type="text" placeholder="Search test e.g. MRI, CBC, Ultrasound..."/>
<button class="btn grad" onclick="searchTest()">Search</button>
</div>
<div style="font-size:.8rem;font-weight:700;color:var(--dim);margin-bottom:12px">Popular Tests</div>
<div class="test-grid">
<div class="test-card" onclick="selectTest(this,'CBC Blood Test')"><div class="ti">🩸</div><div class="tn">CBC Blood Test</div></div>
<div class="test-card" onclick="selectTest(this,'X-Ray')"><div class="ti">🩻</div><div class="tn">X-Ray</div></div>
<div class="test-card" onclick="selectTest(this,'Ultrasound')"><div class="ti">📡</div><div class="tn">Ultrasound</div></div>
<div class="test-card" onclick="selectTest(this,'MRI Scan')"><div class="ti">🧲</div><div class="tn">MRI Scan</div></div>
<div class="test-card" onclick="selectTest(this,'CT Scan')"><div class="ti">💻</div><div class="tn">CT Scan</div></div>
<div class="test-card" onclick="selectTest(this,'Blood Sugar')"><div class="ti">💉</div><div class="tn">Blood Sugar</div></div>
<div class="test-card" onclick="selectTest(this,'Thyroid Test')"><div class="ti">🦋</div><div class="tn">Thyroid Test</div></div>
<div class="test-card" onclick="selectTest(this,'Urine Test')"><div class="ti">🧪</div><div class="tn">Urine Test</div></div>
<div class="test-card" onclick="selectTest(this,'ECG')"><div class="ti">❤️</div><div class="tn">ECG</div></div>
<div class="test-card" onclick="selectTest(this,'Pregnancy Test')"><div class="ti">🤰</div><div class="tn">Pregnancy Test</div></div>
<div class="test-card" onclick="selectTest(this,'Covid Test')"><div class="ti">😷</div><div class="tn">Covid Test</div></div>
<div class="test-card" onclick="selectTest(this,'Other Test')"><div class="ti">🔬</div><div class="tn">Other</div></div>
</div>
<div style="font-size:.8rem;font-weight:700;color:var(--dim);margin-bottom:12px" id="centersLabel">All Diagnostic Centers</div>
<div class="center-grid" id="centerGrid"><div class="spinner"></div></div>
</div>
<div class="modal-overlay" id="bookModal">
<div class="modal-card">
<button class="modal-close" onclick="closeModal()">✕</button>
<div id="modalCenterInfo" style="margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--line)"></div>
<h3 style="font-family:Orbitron,sans-serif;font-size:.85rem;color:var(--cyan);margin-bottom:14px">Book Test</h3>
<div class="field"><label>Test Required</label><input id="bTest" type="text" placeholder="e.g. MRI Brain, CBC, Ultrasound"/></div>
<div class="field"><label>Your Name</label><input id="bName" type="text" placeholder="Your full name"/></div>
<div class="field"><label>Your Phone</label><input id="bPhone" type="tel" placeholder="03XX-XXXXXXX"/></div>
<div class="field"><label>Preferred Date</label><input id="bDate" type="date"/></div>
<div class="field"><label>Doctor Referral (optional)</label><input id="bDoctor" type="text" placeholder="Referring doctor name"/></div>
<button class="btn wa full" onclick="sendBooking()">💬 Book via WhatsApp</button>
</div>
</div>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import{getFirestore,collection,getDocs}from'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
const app=initializeApp({apiKey:'AIzaSyD37yFDGpB8bLQDLzPcyih65os63p6_6v0',authDomain:'abbottabad-prime.firebaseapp.com',projectId:'abbottabad-prime'});
const db=getFirestore(app);
let allCenters=[];
let currentCenter=null;
let selectedTest='';
function toast(msg,type){const t=document.createElement('div');t.className='toast '+(type||'');t.textContent=msg;document.getElementById('toaster').appendChild(t);setTimeout(()=>t.remove(),3000);}
async function loadCenters(){
const grid=document.getElementById('centerGrid');
try{
const snap=await getDocs(collection(db,'vendors'));
allCenters=snap.docs.map(d=>({id:d.id,...d.data()})).filter(v=>v.adminApproved&&!v.blacklisted&&v.category&&(v.category.includes('Laboratory')||v.category.includes('Lab')||v.category.includes('Diagnostic')||v.category.includes('Radiology')||v.category.includes('Patholog')));
renderCenters(allCenters);
}catch(e){grid.innerHTML='<div class="empty">Could not load centers.</div>';}
}
function renderCenters(list){
const grid=document.getElementById('centerGrid');
if(!list.length){grid.innerHTML='<div class="empty">No diagnostic centers found.<br><small>Centers registered under Medical Laboratory category will appear here.</small></div>';return;}
grid.innerHTML=list.map(v=>'<div class="center-card">'+(v.photo?'<img src="'+v.photo+'" style="width:100%;height:100px;object-fit:cover;border-radius:10px;margin-bottom:12px"/>':'<div style="font-size:2rem;margin-bottom:10px">🔬</div>')+'<div style="font-weight:800;font-size:.95rem;margin-bottom:4px">'+v.name+'</div><div style="color:var(--cyan);font-size:.78rem;margin-bottom:6px">'+v.category+'</div><div style="color:var(--faint);font-size:.75rem;margin-bottom:12px">📍 '+(v.city||v.address||'Abbottabad')+'</div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn grad" style="font-size:.76rem;padding:7px 12px" onclick="openBooking(\''+v.id+'\')">📅 Book Test</button><a href="https://wa.me/92'+(v.phone||'').replace(/^0/,'').replace(/[^0-9]/g,'')+'" target="_blank" class="btn wa" style="font-size:.76rem;padding:7px 12px">💬 WhatsApp</a></div></div>').join('');
}
window.selectTest=function(card,test){
document.querySelectorAll('.test-card').forEach(c=>c.classList.remove('selected'));
card.classList.add('selected');
selectedTest=test;
document.getElementById('centersLabel').textContent='Centers for: '+test;
toast(test+' selected — choose a center below','ok');
};
window.searchTest=function(){
const q=document.getElementById('testSearch').value.trim();
if(q){selectedTest=q;document.getElementById('centersLabel').textContent='Centers for: '+q;}
renderCenters(allCenters);
toast('Showing all centers — call to confirm test availability','ok');
};
window.openBooking=function(id){
currentCenter=allCenters.find(v=>v.id===id);
if(!currentCenter)return;
document.getElementById('modalCenterInfo').innerHTML='<div style="font-weight:800;font-size:1rem">'+currentCenter.name+'</div><div style="color:var(--cyan);font-size:.82rem;margin-top:2px">'+currentCenter.category+'</div><div style="color:var(--faint);font-size:.75rem;margin-top:4px">📍 '+(currentCenter.city||currentCenter.address||'Abbottabad')+'</div>';
document.getElementById('bTest').value=selectedTest||'';
document.getElementById('bDate').value=new Date().toISOString().split('T')[0];
document.getElementById('bookModal').classList.add('open');
};
window.closeModal=function(){document.getElementById('bookModal').classList.remove('open');};
window.sendBooking=function(){
const test=document.getElementById('bTest').value.trim();
const name=document.getElementById('bName').value.trim();
const phone=document.getElementById('bPhone').value.trim();
const date=document.getElementById('bDate').value;
const doctor=document.getElementById('bDoctor').value.trim();
if(!test||!name||!phone){toast('Please fill Test, Name and Phone','err');return;}
const msg='🔬 *Test Booking*\n\n🧪 Test: '+test+'\n👤 Patient: '+name+'\n📞 Phone: '+phone+'\n📅 Date: '+date+(doctor?'\n👨‍⚕️ Referred by: '+doctor:'')+'\n\nBooked via Pakistan Prime Portal';
const cPhone='92'+(currentCenter.phone||'').replace(/^0/,'').replace(/[^0-9]/g,'');
window.open('https://wa.me/'+cPhone+'?text='+encodeURIComponent(msg),'_blank');
toast('Booking sent!','ok');
closeModal();
};
loadCenters();
</script>
</body>
</html>
