<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Doctor Dashboard</title><link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet"/><style>:root{--bg:#0b0f19;--surface:#121826;--surface2:rgba(18,24,38,0.8);--line:rgba(0,242,254,0.15);--cyan:#00f2fe;--green:#1aff8c;--txt:#eaf2ff;--dim:#9fb0cc;--faint:#6b7a99;--grad:linear-gradient(110deg,#00f2fe,#2b6fff 45%,#1aff8c);--red:#ff5d6c;--gold:#ffd700;}*{box-sizing:border-box;margin:0;padding:0}body{font-family:Manrope,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}.sidebar{position:fixed;left:0;top:0;bottom:0;width:220px;background:var(--surface);border-right:1px solid var(--line);padding:18px 0;z-index:50;overflow-y:auto;transition:transform .3s}.brand{padding:0 18px 18px;border-bottom:1px solid var(--line);margin-bottom:14px}.brand h2{font-family:Orbitron,sans-serif;font-size:.85rem;font-weight:700;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}.nav-item{display:flex;align-items:center;gap:10px;padding:12px 18px;color:var(--dim);font-weight:600;font-size:.86rem;cursor:pointer;border:0;background:none;width:100%;text-align:left;font-family:inherit;transition:all .25s;border-left:3px solid transparent}.nav-item:hover,.nav-item.active{color:var(--cyan);background:rgba(0,242,254,.06);border-left-color:var(--cyan)}.main{margin-left:220px;padding:22px;min-height:100vh}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:10px}.topbar h2{font-family:Orbitron,sans-serif;font-size:1rem;font-weight:700;color:var(--cyan)}.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}.stat-card{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:18px;text-align:center}.sn{font-family:Orbitron,sans-serif;font-size:1.6rem;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}.sl{font-size:.76rem;color:var(--dim);margin-top:6px;font-weight:600}.panel{display:none}.panel.active{display:block}.card{background:var(--surface2);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}.card h3{font-family:Orbitron,sans-serif;font-size:.9rem;font-weight:700;color:var(--cyan);margin-bottom:14px}.btn{display:inline-flex;align-items:center;gap:6px;cursor:pointer;border:0;font-family:Manrope,sans-serif;font-weight:700;font-size:.82rem;padding:8px 14px;border-radius:9px;text-decoration:none;transition:all .25s}.btn.grad{color:#04121f;background:var(--grad)}.btn.ghost{background:transparent;color:var(--txt);border:1px solid var(--line)}.btn.ok{background:linear-gradient(120deg,#1aff8c,#08b85f);color:#04190d}.btn.danger{background:linear-gradient(120deg,#ff5d6c,#c81e3a);color:#fff}.btn.wa{background:linear-gradient(135deg,#25d366,#0fae53);color:#03190d}.btn.full{width:100%;justify-content:center;margin-top:8px}.btn.sm{padding:6px 10px;font-size:.76rem}.field{margin-bottom:14px}.field label{display:block;font-size:.8rem;font-weight:700;color:var(--dim);margin-bottom:6px}.field input,.field select,.field textarea{width:100%;background:rgba(11,15,25,.8);border:1px solid var(--line);border-radius:10px;color:var(--txt);font-family:inherit;font-size:.92rem;padding:11px 13px;outline:0;transition:border-color .25s}.field input:focus,.field select:focus{border-color:var(--cyan)}.appt-slot{background:rgba(0,242,254,.05);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}.appt-slot.booked{border-color:rgba(26,255,140,.3);background:rgba(26,255,140,.05)}.appt-slot.done{opacity:.6}.spinner{width:28px;height:28px;border:3px solid rgba(0,242,254,.2);border-top-color:var(--cyan);border-radius:50%;margin:20px auto;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.empty{text-align:center;padding:40px 20px;color:var(--faint);font-size:.9rem}.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:none;align-items:center;justify-content:center;padding:16px}.modal-overlay.open{display:flex}.modal-card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto;position:relative}.modal-close{position:absolute;top:12px;right:12px;background:none;border:0;color:var(--faint);font-size:1.2rem;cursor:pointer}#toaster{position:fixed;top:16px;right:16px;z-index:200;display:flex;flex-direction:column;gap:8px;width:min(90vw,340px)}.toast{padding:11px 14px;border-radius:11px;background:var(--surface);border:1px solid var(--line);font-size:.84rem;font-weight:600}.toast.ok{border-color:rgba(26,255,140,.5)}.toast.err{border-color:rgba(255,93,108,.5)}.mobile-btn{display:none;position:fixed;bottom:18px;right:18px;z-index:60;width:46px;height:46px;border-radius:50%;background:var(--grad);border:0;color:#04121f;font-size:1.3rem;cursor:pointer}@media(max-width:768px){.sidebar{transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}.main{margin-left:0;padding:14px}.stats-grid{grid-template-columns:repeat(2,1fr)}.mobile-btn{display:block}}</style></head><body><div id="toaster"></div><aside class="sidebar" id="sidebar"><div class="brand"><h2>Doctor Panel</h2><p id="docName">Loading...</p></div><button class="nav-item active" onclick="showPanel('overview')" id="nav-overview">Overview</button><button class="nav-item" onclick="showPanel('appointments')" id="nav-appointments">Appointments</button><button class="nav-item" onclick="showPanel('patients')" id="nav-patients">Patients</button><button class="nav-item" onclick="showPanel('prescription')" id="nav-prescription">Prescription</button><button class="nav-item" onclick="showPanel('schedule')" id="nav-schedule">Schedule</button><button class="nav-item" onclick="showPanel('analytics')" id="nav-analytics">Analytics</button><div style="padding:14px 18px;border-top:1px solid var(--line);margin-top:auto"><a href="/" class="btn ghost" style="width:100%;justify-content:center;margin-bottom:8px;font-size:.8rem">Main Site</a><button class="btn danger" onclick="doLogout()" style="width:100%;justify-content:center;font-size:.8rem">Logout</button></div></aside><main class="main"><div class="topbar"><h2 id="pageTitle">Overview</h2><div style="font-size:.8rem;color:var(--cyan)" id="todayDate"></div></div><div class="stats-grid"><div class="stat-card"><div class="sn" id="statToday">0</div><div class="sl">Today Patients</div></div><div class="stat-card"><div class="sn" id="statTotal">0</div><div class="sl">Total Patients</div></div><div class="stat-card"><div class="sn" id="statPending">0</div><div class="sl">Pending</div></div><div class="stat-card"><div class="sn" id="statRevenue">0</div><div class="sl">Revenue PKR</div></div></div><div class="panel active" id="panel-overview"><div class="card"><h3>Today Appointments</h3><div id="todayAppointments"><div class="spinner"></div></div></div><div class="card"><h3>Quick Actions</h3><button class="btn grad full" onclick="showPanel('appointments')">Book Appointment</button><button class="btn ghost full" onclick="showPanel('prescription')" style="margin-top:8px">Write Prescription</button><button class="btn wa full" onclick="sendDailyReport()" style="margin-top:8px">Daily Report via WhatsApp</button></div></div><div class="panel" id="panel-appointments"><div class="card"><h3>Book Appointment</h3><div class="field"><label>Patient Phone</label><input id="apptPhone" type="tel" placeholder="03XX-XXXXXXX"/></div><div class="field"><label>Patient Name</label><input id="apptName" type="text" placeholder="Patient name"/></div><div class="field"><label>Date</label><input id="apptDate" type="date"/></div><div class="field"><label>Time Slot</label><select id="apptTime"><option value="09:00">9:00 AM</option><option value="09:30">9:30 AM</option><option value="10:00">10:00 AM</option><option value="10:30">10:30 AM</option><option value="11:00">11:00 AM</option><option value="11:30">11:30 AM</option><option value="12:00">12:00 PM</option><option value="14:00">2:00 PM</option><option value="14:30">2:30 PM</option><option value="15:00">3:00 PM</option><option value="15:30">3:30 PM</option><option value="16:00">4:00 PM</option><option value="17:00">5:00 PM</option><option value="18:00">6:00 PM</option></select></div><div class="field"><label>Complaint</label><input id="apptComplaint" type="text" placeholder="Chief complaint"/></div><div class="field"><label>Fee PKR</label><input id="apptFee" type="number" placeholder="500"/></div><button class="btn grad full" onclick="bookAppointment()">Book</button></div><div class="card"><h3>All Appointments</h3><div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap"><button class="btn ghost sm" onclick="filterAppts('all',this)">All</button><button class="btn ghost sm" onclick="filterAppts('pending',this)">Pending</button><button class="btn ghost sm" onclick="filterAppts('done',this)">Done</button><button class="btn ghost sm" onclick="filterAppts('cancelled',this)">Cancelled</button></div><div id="appointmentsList"><div class="spinner"></div></div></div></div><div class="panel" id="panel-patients"><div class="card"><h3>Search Patient</h3><div style="display:flex;gap:8px;margin-bottom:14px"><input id="patientSearch" type="tel" placeholder="Search by phone" style="flex:1;background:rgba(11,15,25,.8);border:1px solid var(--line);border-radius:10px;color:var(--txt);padding:10px 13px;outline:0;font-family:inherit"/><button class="btn grad" onclick="searchPatient()">Search</button></div><div id="patientResult"></div></div><div class="card"><h3>Register Patient</h3><div class="field"><label>Full Name</label><input id="pName" type="text" placeholder="Patient name"/></div><div class="field"><label>Phone</label><input id="pPhone" type="tel" placeholder="03XX-XXXXXXX"/></div><div class="field"><label>Age</label><input id="pAge" type="number" placeholder="Age"/></div><div class="field"><label>Gender</label><select id="pGender"><option value="Male">Male</option><option value="Female">Female</option><option value="Other">Other</option></select></div><div class="field"><label>Blood Group</label><select id="pBlood"><option value="">Unknown</option><option value="A+">A+</option><option value="A-">A-</option><option value="B+">B+</option><option value="B-">B-</option><option value="O+">O+</option><option value="O-">O-</option><option value="AB+">AB+</option><option value="AB-">AB-</option></select></div><div class="field"><label>Allergies</label><input id="pAllergy" type="text" placeholder="e.g. Penicillin"/></div><div class="field"><label>Chronic Conditions</label><input id="pChronic" type="text" placeholder="e.g. Diabetes"/></div><button class="btn grad full" onclick="registerPatient()">Save Patient</button></div></div><div class="panel" id="panel-prescription"><div class="card"><h3>Write Prescription</h3><div class="field"><label>Patient Phone</label><div style="display:flex;gap:8px"><input id="rxPhone" type="tel" placeholder="03XX-XXXXXXX" style="flex:1"/><button class="btn ghost sm" onclick="loadPatientForRx()">Load</button></div></div><div id="rxPatientInfo" style="display:none;background:rgba(0,242,254,.05);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:14px;font-size:.84rem"></div><div class="field"><label>Diagnosis</label><input id="rxDiagnosis" type="text" placeholder="e.g. URTI"/></div><div class="field"><label>Complaint</label><input id="rxComplaint" type="text" placeholder="Chief complaint"/></div><div id="medicineList"><div class="medicine-row" style="background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px"><div style="display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px"><input class="med-name" type="text" placeholder="Medicine" style="background:rgba(11,15,25,.8);border:1px solid var(--line);border-radius:8px;color:var(--txt);padding:8px;font-family:inherit;outline:0"/><input class="med-dose" type="text" placeholder="Dose" style="background:rgba(11,15,25,.8);border:1px solid var(--line);border-radius:8px;color:var(--txt);padding:8px;font-family:inherit;outline:0"/><input class="med-dur" type="text" placeholder="Duration" style="background:rgba(11,15,25,.8);border:1px solid var(--line);border-radius:8px;color:var(--txt);padding:8px;font-family:inherit;outline:0"/></div><input class="med-inst" type="text" placeholder="Instructions e.g. After meal" style="width:100%;margin-top:6px;background:rgba(11,15,25,.8);border:1px solid var(--line);border-radius:8px;color:var(--txt);padding:8px;font-family:inherit;outline:0"/></div></div><button class="btn ghost full" onclick="addMedicineRow()" style="margin-bottom:10px">Add Medicine</button><div class="field"><label>Doctor Notes</label><textarea id="rxNotes" placeholder="Additional instructions" style="min-height:60px"></textarea></div><div class="field"><label>Follow-up After</label><select id="rxFollowup"><option value="">No follow-up</option><option value="3">3 days</option><option value="5">5 days</option><option value="7">1 week</option><option value="14">2 weeks</option><option value="30">1 month</option></select></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px"><button class="btn grad" onclick="sendPrescription()">Send via WhatsApp</button><button class="btn ok" onclick="savePrescription()">Save Record</button></div></div></div><div class="panel" id="panel-schedule"><div class="card"><h3>My Schedule</h3><div class="field"><label>Consultation Fee PKR</label><input id="schedFee" type="number" placeholder="500"/></div><div class="field"><label>Morning Hours</label><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><input id="schedMornStart" type="time" value="09:00"/><input id="schedMornEnd" type="time" value="13:00"/></div></div><div class="field"><label>Evening Hours</label><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><input id="schedEveStart" type="time" value="17:00"/><input id="schedEveEnd" type="time" value="21:00"/></div></div><div class="field"><label>Off Days</label><div style="display:flex;gap:8px;flex-wrap:wrap" id="offDays"><label style="display:flex;align-items:center;gap:4px;font-size:.82rem"><input type="checkbox" value="Sunday"/> Sun</label><label style="display:flex;align-items:center;gap:4px;font-size:.82rem"><input type="checkbox" value="Monday"/> Mon</label><label style="display:flex;align-items:center;gap:4px;font-size:.82rem"><input type="checkbox" value="Tuesday"/> Tue</label><label style="display:flex;align-items:center;gap:4px;font-size:.82rem"><input type="checkbox" value="Wednesday"/> Wed</label><label style="display:flex;align-items:center;gap:4px;font-size:.82rem"><input type="checkbox" value="Thursday"/> Thu</label><label style="display:flex;align-items:center;gap:4px;font-size:.82rem"><input type="checkbox" value="Friday"/> Fri</label><label style="display:flex;align-items:center;gap:4px;font-size:.82rem"><input type="checkbox" value="Saturday"/> Sat</label></div></div><button class="btn grad full" onclick="saveSchedule()">Save Schedule</button></div></div><div class="panel" id="panel-analytics"><div class="card"><h3>Analytics</h3><div id="analyticsContent"><div class="spinner"></div></div></div></div></main><button class="mobile-btn" onclick="document.getElementById('sidebar').classList.toggle('open')">Menu</button><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";import{getFirestore,collection,getDocs,doc,updateDoc,addDoc,query,where,deleteDoc}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";const app=initializeApp({apiKey:"AIzaSyD37yFDGpB8bLQDLzPcyih65os63p6_6v0",authDomain:"abbottabad-prime.firebaseapp.com",projectId:"abbottabad-prime",storageBucket:"abbottabad-prime.firebasestorage.app",messagingSenderId:"673825253973",appId:"1:673825253973:web:2972cd69f9a2183ca702dc"});const db=getFirestore(app);window.db=db;window.fbCol=collection;window.fbGet=getDocs;window.fbDoc=doc;window.fbUpdate=updateDoc;window.fbAdd=addDoc;window.fbQ=query;window.fbWhere=where;window.fbDelete=deleteDoc;</script><script>
function getCookie(n){const v=document.cookie.match("(^|;) ?"+n+"=([^;]*)(;|$)");return v?decodeURIComponent(v[2]):null;}
const doctorEmail=localStorage.getItem("vendorEmail")||getCookie("vendorEmail");
if(!doctorEmail){window.location.href="/vendor/login.html";}
let doctorData=null,allAppointments=[],allPatients=[];
document.getElementById("todayDate").textContent=new Date().toLocaleDateString("en-PK",{weekday:"long",year:"numeric",month:"long",day:"numeric"});
function toast(msg,type){const el=document.createElement("div");el.className="toast "+(type||"");el.textContent=msg;document.getElementById("toaster").appendChild(el);setTimeout(function(){el.remove();},4500);}
async function init(){
  try{
    const snap=await window.fbGet(window.fbQ(window.fbCol(window.db,"vendors"),window.fbWhere("email","==",doctorEmail)));
    if(snap.empty){toast("Profile not found.","err");return;}
    doctorData=Object.assign({id:snap.docs[0].id},snap.docs[0].data());
    document.getElementById("docName").textContent=doctorData.name||"Doctor";
    loadAppointments();loadPatients();loadSchedule();loadAnalytics();
  }catch(e){toast("Could not load.","err");}
}
init();
async function loadAppointments(){
  try{
    const today=new Date().toISOString().split("T")[0];
    const snap=await window.fbGet(window.fbQ(window.fbCol(window.db,"appointments"),window.fbWhere("doctorPhone","==",doctorData.phone)));
    allAppointments=snap.docs.map(function(d){return Object.assign({id:d.id},d.data());});
    allAppointments.sort(function(a,b){return new Date(a.datetime||0)-new Date(b.datetime||0);});
    const todayA=allAppointments.filter(function(a){return a.date===today;});
    document.getElementById("statToday").textContent=todayA.length;
    document.getElementById("statPending").textContent=todayA.filter(function(a){return a.status==="pending";}).length;
    document.getElementById("statRevenue").textContent=(todayA.filter(function(a){return a.status==="done";}).length*(parseInt(doctorData.fee)||500)).toLocaleString();
    renderTodayAppts(todayA);renderAllAppts(allAppointments);
  }catch(e){}
}
function renderTodayAppts(appts){
  const el=document.getElementById("todayAppointments");
  if(!appts.length){el.innerHTML="<div class=\"empty\">No appointments today.</div>";return;}
  el.innerHTML=appts.map(function(a){
    return "<div class=\"appt-slot "+(a.status==="done"?"done":"booked")+"\">"
    +"<div><div style=\"font-weight:700;font-size:.88rem\">"+a.patientName+"</div>"
    +"<div style=\"font-size:.76rem;color:var(--dim)\">"+a.time+" - "+a.complaint+"</div></div>"
    +"<div style=\"display:flex;gap:6px\">"
    +(a.status!=="done"?"<button class=\"btn ok sm\" onclick=\"markDone('"+a.id+"')\" >Done</button>":"<span style=\"color:var(--cyan)\">Done</span>")
    +"<a href=\"tel:"+a.patientPhone+"\" class=\"btn ghost sm\">Call</a>"
    +"</div></div>";
  }).join("");
}
function renderAllAppts(appts){
  const el=document.getElementById("appointmentsList");
  if(!appts.length){el.innerHTML="<div class=\"empty\">No appointments yet.</div>";return;}
  el.innerHTML=appts.map(function(a){
    return "<div class=\"appt-slot "+(a.status==="done"?"done":"booked")+"\" style=\"margin-bottom:8px\">"
    +"<div><div style=\"font-weight:700;font-size:.86rem\">"+a.patientName+"</div>"
    +"<div style=\"font-size:.74rem;color:var(--dim)\">"+a.date+" "+a.time+" - "+a.complaint+"</div></div>"
    +"<div style=\"display:flex;gap:6px;flex-wrap:wrap\">"
    +(a.status!=="done"?"<button class=\"btn ok sm\" onclick=\"markDone('"+a.id+"')\" >Done</button>":"")
    +"<button class=\"btn ghost sm\" onclick=\"openRxForPatient('"+a.patientPhone+"','"+a.patientName+"')\" >Rx</button>"
    +"<a href=\"https://wa.me/92"+a.patientPhone.replace(/^0/,"").replace(/[^0-9]/g,"")+"?\" target=\"_blank\" class=\"btn wa sm\">WA</a>"
    +"<button class=\"btn danger sm\" onclick=\"cancelAppt('"+a.id+"')\" >Cancel</button>"
    +"</div></div>";
  }).join("");
}
function filterAppts(status,btn){
  document.querySelectorAll("#panel-appointments .btn.ghost.sm").forEach(function(b){b.classList.remove("active");});
  btn.classList.add("active");
  renderAllAppts(status==="all"?allAppointments:allAppointments.filter(function(a){return a.status===status;}));
}
async function bookAppointment(){
  const phone=document.getElementById("apptPhone").value.trim();
  const name=document.getElementById("apptName").value.trim();
  const date=document.getElementById("apptDate").value;
  const time=document.getElementById("apptTime").value;
  const complaint=document.getElementById("apptComplaint").value.trim();
  const fee=document.getElementById("apptFee").value||doctorData.fee||500;
  if(!phone||!name||!date){toast("Fill name, phone and date.","err");return;}
  try{
    await window.fbAdd(window.fbCol(window.db,"appointments"),{doctorPhone:doctorData.phone,doctorName:doctorData.name,patientPhone:phone,patientName:name,date:date,time:time,datetime:date+"T"+time,complaint:complaint,fee:fee,status:"pending",createdAt:new Date().toISOString()});
    const msg="Appointment Confirmed! Dear "+name+", appointment with Dr."+doctorData.name+" on "+date+" at "+time+". Pakistan Prime Portal";
    window.open("https://wa.me/92"+phone.replace(/^0/,"").replace(/[^0-9]/g,"")+"?text="+encodeURIComponent(msg),"_blank");
    toast("Appointment booked!","ok");loadAppointments();
    ["apptPhone","apptName","apptComplaint","apptFee"].forEach(function(id){document.getElementById(id).value="";});
  }catch(e){toast("Could not book.","err");}
}
async function markDone(id){
  try{
    await window.fbUpdate(window.fbDoc(window.db,"appointments",id),{status:"done",doneAt:new Date().toISOString()});
    const a=allAppointments.find(function(a){return a.id===id;});if(a)a.status="done";
    loadAppointments();toast("Marked done!","ok");
  }catch(e){toast("Could not update.","err");}
}
async function cancelAppt(id){
  if(!confirm("Cancel?"))return;
  try{await window.fbUpdate(window.fbDoc(window.db,"appointments",id),{status:"cancelled"});loadAppointments();toast("Cancelled.","ok");}catch(e){}
}
async function loadPatients(){
  try{
    const snap=await window.fbGet(window.fbQ(window.fbCol(window.db,"patients"),window.fbWhere("doctorPhone","==",doctorData.phone)));
    allPatients=snap.docs.map(function(d){return Object.assign({id:d.id},d.data());});
    document.getElementById("statTotal").textContent=allPatients.length;
  }catch(e){}
}
async function searchPatient(){
  const phone=document.getElementById("patientSearch").value.trim();
  if(!phone){toast("Enter phone.","err");return;}
  const el=document.getElementById("patientResult");
  el.innerHTML="<div class=\"spinner\"></div>";
  try{
    const snap=await window.fbGet(window.fbQ(window.fbCol(window.db,"patients"),window.fbWhere("phone","==",phone),window.fbWhere("doctorPhone","==",doctorData.phone)));
    if(snap.empty){el.innerHTML="<div class=\"empty\">Not found.</div>";return;}
    const p=Object.assign({id:snap.docs[0].id},snap.docs[0].data());
    el.innerHTML="<div style=\"background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:12px;padding:14px\">"
    +"<div style=\"font-weight:700\">"+p.name+"</div>"
    +"<div style=\"font-size:.76rem;color:var(--dim)\">"+p.phone+" | "+p.age+" yrs | "+p.gender+"</div>"
    +(p.bloodGroup?"<div style=\"font-size:.76rem;color:var(--red)\">Blood: "+p.bloodGroup+"</div>":"")
    +(p.allergies?"<div style=\"font-size:.76rem;color:#ffd24d\">Allergies: "+p.allergies+"</div>":"")
    +(p.chronic?"<div style=\"font-size:.76rem;color:var(--dim)\">Conditions: "+p.chronic+"</div>":"")
    +"<div style=\"display:flex;gap:6px;margin-top:10px\">"
    +"<button class=\"btn grad sm\" onclick=\"openRxForPatient('"+p.phone+"','"+p.name+"')\" >Prescription</button>"
    +"<a href=\"https://wa.me/92"+p.phone.replace(/^0/,"").replace(/[^0-9]/g,"")+"?\" target=\"_blank\" class=\"btn wa sm\">WA</a>"
    +"</div></div>";
  }catch(e){el.innerHTML="<div class=\"empty\">Error.</div>";}
}
async function registerPatient(){
  const name=document.getElementById("pName").value.trim();
  const phone=document.getElementById("pPhone").value.trim();
  if(!name||!phone){toast("Name and phone required.","err");return;}
  try{
    await window.fbAdd(window.fbCol(window.db,"patients"),{doctorPhone:doctorData.phone,name:name,phone:phone,age:document.getElementById("pAge").value,gender:document.getElementById("pGender").value,bloodGroup:document.getElementById("pBlood").value,allergies:document.getElementById("pAllergy").value.trim(),chronic:document.getElementById("pChronic").value.trim(),registeredAt:new Date().toISOString()});
    toast("Patient registered!","ok");loadPatients();
    ["pName","pPhone","pAge","pAllergy","pChronic"].forEach(function(id){document.getElementById(id).value="";});
  }catch(e){toast("Could not register.","err");}
}
function addMedicineRow(){
  const div=document.createElement("div");div.className="medicine-row";
  div.style.cssText="background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px";
  div.innerHTML="<div style=\"display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px\">"
  +"<input class=\"med-name\" type=\"text\" placeholder=\"Medicine\" style=\"background:rgba(11,15,25,.8);border:1px solid var(--line);border-radius:8px;color:var(--txt);padding:8px;font-family:inherit;outline:0\"/>"
  +"<input class=\"med-dose\" type=\"text\" placeholder=\"Dose\" style=\"background:rgba(11,15,25,.8);border:1px solid var(--line);border-radius:8px;color:var(--txt);padding:8px;font-family:inherit;outline:0\"/>"
  +"<input class=\"med-dur\" type=\"text\" placeholder=\"Duration\" style=\"background:rgba(11,15,25,.8);border:1px solid var(--line);border-radius:8px;color:var(--txt);padding:8px;font-family:inherit;outline:0\"/>"
  +"</div><input class=\"med-inst\" type=\"text\" placeholder=\"Instructions\" style=\"width:100%;margin-top:6px;background:rgba(11,15,25,.8);border:1px solid var(--line);border-radius:8px;color:var(--txt);padding:8px;font-family:inherit;outline:0\"/>"

async function loadPatientForRx(){
  const phone=document.getElementById("rxPhone").value.trim();if(!phone)return;
  const el=document.getElementById("rxPatientInfo");
  try{
    const snap=await window.fbGet(window.fbQ(window.fbCol(window.db,"patients"),window.fbWhere("phone","==",phone),window.fbWhere("doctorPhone","==",doctorData.phone)));
    if(!snap.empty){const p=snap.docs[0].data();el.innerHTML="Patient: "+p.name+" | Age: "+p.age+(p.allergies?" | Allergies: "+p.allergies:"");el.style.display="block";}
  }catch(e){}
}
function openRxForPatient(phone,name){showPanel("prescription");document.getElementById("rxPhone").value=phone;loadPatientForRx();}
function getMedicines(){
  const meds=[];
  document.querySelectorAll(".medicine-row").forEach(function(r){
    const name=r.querySelector(".med-name").value.trim();
    if(name)meds.push({name:name,dose:r.querySelector(".med-dose").value.trim(),duration:r.querySelector(".med-dur").value.trim(),instructions:r.querySelector(".med-inst").value.trim()});
  });
  return meds;
}
async function sendPrescription(){
  const phone=document.getElementById("rxPhone").value.trim();
  const diagnosis=document.getElementById("rxDiagnosis").value.trim();
  const meds=getMedicines();
  if(!phone){toast("Enter patient phone.","err");return;}
  if(!meds.length){toast("Add at least one medicine.","err");return;}
  const snap=await window.fbGet(window.fbQ(window.fbCol(window.db,"patients"),window.fbWhere("phone","==",phone)));
  const pName=snap.empty?"Patient":snap.docs[0].data().name;
  const notes=document.getElementById("rxNotes").value.trim();
  const followup=document.getElementById("rxFollowup").value;
  let msg="Prescription - Pakistan Prime\n\nPatient: "+pName+"\nDiagnosis: "+diagnosis+"\nDate: "+new Date().toLocaleDateString()+"\nDr. "+doctorData.name+"\n\nMedicines:\n";
  meds.forEach(function(m,i){msg+=(i+1)+". "+m.name+(m.dose?" - "+m.dose:"")+(m.duration?" - "+m.duration:"")+(m.instructions?" ("+m.instructions+")" :"")+"\n";});
  if(notes)msg+="\nNotes: "+notes;
  if(followup)msg+="\nFollow-up after "+followup+" days";
  msg+="\n\nPakistan Prime Portal";
  window.open("https://wa.me/92"+phone.replace(/^0/,"").replace(/[^0-9]/g,"")+"?text="+encodeURIComponent(msg),"_blank");
  toast("Prescription sent!","ok");
}
async function savePrescription(){
  const phone=document.getElementById("rxPhone").value.trim();
  const diagnosis=document.getElementById("rxDiagnosis").value.trim();
  const meds=getMedicines();
  if(!phone||!diagnosis){toast("Phone and diagnosis required.","err");return;}
  try{
    await window.fbAdd(window.fbCol(window.db,"prescriptions"),{doctorPhone:doctorData.phone,doctorName:doctorData.name,patientPhone:phone,diagnosis:diagnosis,complaint:document.getElementById("rxComplaint").value.trim(),medicines:meds.map(function(m){return m.name+" "+m.dose;}).join(", "),medicineDetails:meds,notes:document.getElementById("rxNotes").value.trim(),followupDays:document.getElementById("rxFollowup").value,createdAt:new Date().toISOString()});
    toast("Prescription saved!","ok");
  }catch(e){toast("Could not save.","err");}
}
async function saveSchedule(){
  try{
    const offDays=Array.from(document.querySelectorAll("#offDays input:checked")).map(function(c){return c.value;});
    await window.fbUpdate(window.fbDoc(window.db,"vendors",doctorData.id),{fee:document.getElementById("schedFee").value,schedule:{mornStart:document.getElementById("schedMornStart").value,mornEnd:document.getElementById("schedMornEnd").value,eveStart:document.getElementById("schedEveStart").value,eveEnd:document.getElementById("schedEveEnd").value,offDays:offDays},hours:document.getElementById("schedMornStart").value+"-"+document.getElementById("schedMornEnd").value});
    toast("Schedule saved!","ok");
  }catch(e){toast("Could not save.","err");}
}
function loadSchedule(){
  if(!doctorData||!doctorData.schedule)return;
  const s=doctorData.schedule;
  if(s.mornStart)document.getElementById("schedMornStart").value=s.mornStart;
  if(s.mornEnd)document.getElementById("schedMornEnd").value=s.mornEnd;
  if(s.eveStart)document.getElementById("schedEveStart").value=s.eveStart;
  if(s.eveEnd)document.getElementById("schedEveEnd").value=s.eveEnd;
  if(s.offDays)s.offDays.forEach(function(d){const cb=document.querySelector("#offDays input[value=\""+d+"\"]");if(cb)cb.checked=true;});
  if(doctorData.fee)document.getElementById("schedFee").value=doctorData.fee;
}
async function loadAnalytics(){
  try{
    const today=new Date().toISOString().split("T")[0];
    const snap=await window.fbGet(window.fbQ(window.fbCol(window.db,"appointments"),window.fbWhere("doctorPhone","==",doctorData.phone)));
    const appts=snap.docs.map(function(d){return Object.assign({id:d.id},d.data());});
    const todayDone=appts.filter(function(a){return a.date===today&&a.status==="done";}).length;
    const totalDone=appts.filter(function(a){return a.status==="done";}).length;
    document.getElementById("analyticsContent").innerHTML="<div style=\"font-size:.88rem;color:var(--dim);line-height:2.4\">"
    +"Today Patients: <b style=\"color:var(--txt)\">"+todayDone+"</b><br>"
    +"Total Patients: <b style=\"color:var(--txt)\">"+allPatients.length+"</b><br>"
    +"Completed: <b style=\"color:var(--green)\">"+totalDone+"</b><br>"
    +"Total Revenue: <b style=\"color:var(--cyan)\">PKR "+(totalDone*(parseInt(doctorData.fee)||500)).toLocaleString()+"</b><br>"
    +"Today Revenue: <b style=\"color:var(--cyan)\">PKR "+(todayDone*(parseInt(doctorData.fee)||500)).toLocaleString()+"</b>"
    +(doctorData.fee?"<br>Fee: <b style=\"color:var(--gold)\">PKR "+doctorData.fee+"</b>":"")+"</div>";
  }catch(e){}
}
function sendDailyReport(){
  const today=new Date().toISOString().split("T")[0];
  const todayA=allAppointments.filter(function(a){return a.date===today;});
  const done=todayA.filter(function(a){return a.status==="done";}).length;
  const msg="Daily Report - Dr."+doctorData.name+"\nDate: "+new Date().toLocaleDateString()+"\nPatients: "+todayA.length+"\nSeen: "+done+"\nPending: "+(todayA.length-done)+"\nRevenue: PKR "+(done*(parseInt(doctorData.fee)||500)).toLocaleString()+"\n\nPakistan Prime Portal";
  window.open("https://wa.me/923174886655?text="+encodeURIComponent(msg),"_blank");
}
function showPanel(name){
  document.querySelectorAll(".panel").forEach(function(p){p.classList.remove("active");});
  document.querySelectorAll(".nav-item").forEach(function(n){n.classList.remove("active");});
  document.getElementById("panel-"+name).classList.add("active");
  document.getElementById("nav-"+name).classList.add("active");
  const titles={overview:"Overview",appointments:"Appointments",patients:"Patients",prescription:"Prescription",schedule:"Schedule",analytics:"Analytics"};
  document.getElementById("pageTitle").textContent=titles[name]||name;
  document.getElementById("sidebar").classList.remove("open");
}
function doLogout(){localStorage.removeItem("vendorEmail");localStorage.removeItem("vendorPhone");document.cookie="vendorEmail=;expires=Thu, 01 Jan 1970 00:00:00 UTC;path=/";window.location.href="/vendor/login.html";}
